    "title": "Smart Seaman Mobile API",
    "version": "1.0.0",
    "description": "Authentication uses bearer JWT. Persist each rotated refToken. Activation/reset uid is a single-use action token, never a user UUID. Non-payment operations are an initial route inventory; detailed request and response schemas remain to be documented."
