services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - ${DEV_ENV_FILE:-.env}
    environment:
      APP_ADDRESS: ":8080"
      ENV_FILE: /dev/null
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - .:/app
      - go-build-cache:/go
    working_dir: /app

volumes:
  go-build-cache:
